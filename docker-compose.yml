services:
  postgres:
    image: postgres:15-alpine
    container_name: rasac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rasac
    ports:
      - "5432:5432"
    volumes:
      - rasac_pgdata:/var/lib/postgresql/data

volumes:
  rasac_pgdata:

